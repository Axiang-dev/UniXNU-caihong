name: verify

# Runs on every push, on demand, and once a day: the repository has to stay
# usable by someone cloning it, and links rot quietly.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the repository is self-consistent
        run: python scripts/verify.py
