name: kernel

# Builds the XNU kernel for caihong on a macOS runner. This is the step that
# needs Xcode, which is why it lives in Actions instead of on a Windows host.
#
# The prelink step additionally needs the target IPSW (about 7 GB). It runs only
# when the workflow is started by hand with an ipsw input.

on:
  workflow_dispatch:
    inputs:
      ipsw:
        description: 'IPSW URL or path to also prelink the kernel (optional)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'board.toml'
      - 'configs/**'
      - 'scripts/**'
      - '.github/workflows/kernel.yml'

permissions:
  contents: read

jobs:
  kernel:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: device

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: unixnu
          # Pinned: the driver layout this port was qualified against. Upstream
          # moved on 2026-10-25 and the archive checks changed shape.
          ref: c62bf12595f9a86c1b7282cf12d5af40b441fdac
          # drivers/ are submodules; without them the kernel links without the
          # display probes and fails on undefined symbols.
          submodules: recursive

      - name: Install host tools
        run: |
          brew install cmake ninja unifdef dtc mtools llvm lld
          echo "xcode: $(xcodebuild -version | head -1)"
          echo "clang: $(clang --version | head -1)"

      - name: Select the board configuration
        working-directory: unixnu
        run: ./unixnu defconfig caihong_defconfig -D ../device

      - name: Fetch the pinned sources
        working-directory: unixnu
        run: ./unixnu fetch -D ../device

      - name: Authorize the Apple source lookups
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 device/.github/scripts/patch-xnu-source.py unixnu

      - name: Assemble the build tree
        working-directory: unixnu
        run: ./unixnu tree -D ../device

      - name: Build the kernel
        working-directory: unixnu
        env:
          # prepare-xnu-source.py pulls Apple sources from the GitHub API, which
          # rate limits unauthenticated requests from shared runner addresses.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./unixnu build kernel -D ../device -j "$(sysctl -n hw.ncpu)"

      - name: Prelink against the IPSW
        if: ${{ inputs.ipsw != '' }}
        working-directory: unixnu
        run: ./unixnu build prelink -D ../device --ipsw "${{ inputs.ipsw }}"

      - name: Point AMFI at the board PMGR stand-in
        working-directory: unixnu
        run: |
          python3 ../device/scripts/patch-amfi-pmgr-name.py out/caihong/kernel/kernel.macho
          # Must precede the entry probe: it verifies the untouched entry sequence.
          python3 ../device/scripts/patch-xnu-console.py out/caihong/kernel/kernel.macho

      - name: Build the payload
        working-directory: unixnu
        env:
          # Seeds XNU's IOPlatformUUID together with [payload.adt] chip_id.
          UNIXNU_UNIQUE_CHIP_ID: "0xCA12000000000001"
        run: |
          # The restore ramdisk becomes the boot ramdisk, so the kernel has a
          # minimal Apple userland (launchd) to mount as root.
          # fetch prints the extracted path on its last line
          ramdisk=$(./unixnu ipsw fetch RestoreRamDisk -D ../device | tail -1)
          echo "restore ramdisk: $ramdisk"
          test -f "$ramdisk"
          # The member is IM4P-wrapped; the payload inside is a raw APFS image,
          # which is exactly what the kernel mounts.
          python3 ../device/scripts/unwrap-img4.py "$ramdisk" /tmp/root-ramdisk.img
          ls -la /tmp/root-ramdisk.img
          # AMFI only runs binaries that are in the trust cache; without it the
          # kernel kills launchd with a codesigning SIGKILL right after exec.
          trust=$(./unixnu ipsw fetch RestoreTrustCache -D ../device | tail -1)
          echo "restore trust cache: $trust"
          test -f "$trust"
          ./unixnu build payload -D ../device --data-ramdisk /tmp/root-ramdisk.img --trust-cache "$trust"

      - name: Report the root image size
        working-directory: unixnu
        run: ./unixnu build userdata -D ../device --dry-run

      - name: Keep the kernel prelink plan
        uses: actions/upload-artifact@v4
        with:
          name: kernel-plan
          path: |
            unixnu/out/caihong/kernel/kernel.json
            unixnu/out/caihong/kernel/*.json
            unixnu/out/caihong/tree/archive-env.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          if-no-files-found: warn
          path: |
            unixnu/out/caihong/kernel/**
            unixnu/out/caihong/payload/**
            unixnu/out/caihong/logs/**
            unixnu/out/caihong/*.json
          retention-days: 3
